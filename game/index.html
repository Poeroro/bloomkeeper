<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloomkeeper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #20392a; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640" aria-label="Bloomkeeper: steer the garden drone, click soil plots to plant blooms, and hold ten waves of beetles"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
